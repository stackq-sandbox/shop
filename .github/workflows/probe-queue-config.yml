name: probe queue config
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: read
jobs:
  probe:
    if: github.head_ref == 'probe-queue-config'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          for n in 103 104; do
            gh api graphql -f query="{ repository(owner:\"stackq-sandbox\", name:\"shop\") { pullRequest(number:$n) { number state timelineItems(last:20) { nodes { __typename ... on RemovedFromMergeQueueEvent { createdAt reason beforeCommit { oid } } ... on AddedToMergeQueueEvent { createdAt } ... on MergedEvent { createdAt } } } } } }" || true
            echo
          done
