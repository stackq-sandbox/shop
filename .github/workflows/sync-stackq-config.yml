# These workflows are copies of stackq's examples, apart from the organization
# name. Compare them with the examples of the newest stackq release so a change
# there is not silently missed here. Fails with a diff when they differ.
#
# To fix a failure, copy the example over the file and replace YOUR_ORG with
# shresthaujjwal (a bot cannot do it for you: the built-in GITHUB_TOKEN may not
# push changes to workflow files).
name: sync check

on:
  pull_request:
    paths: [".github/workflows/**"]
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false # only reads files; keep the token off disk
      - name: Compare with stackq's examples
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Read the files through the API. raw.githubusercontent.com caches for
          # five minutes, so right after a release moves v0 it serves the old
          # example and the check reports a difference that is not there.
          api=https://api.github.com/repos/shresthaujjwal/stackq/contents/examples
          status=0
          for pair in stackq.yml:stackq.yml stackq-split.yml:stackq-split.yml ci-merge-group.yml:ci.yml; do
            example=${pair%%:*}
            local_file=.github/workflows/${pair##*:}
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github.raw+json" "$api/$example?ref=v0" |
              sed 's#YOUR_ORG/stackq@v0#shresthaujjwal/stackq@v0#' > "$RUNNER_TEMP/$example"
            if diff -u "$RUNNER_TEMP/$example" "$local_file"; then
              echo "ok: $local_file matches examples/$example"
            else
              echo "::error file=$local_file::out of sync with stackq examples/$example"
              status=1
            fi
          done
          exit $status
