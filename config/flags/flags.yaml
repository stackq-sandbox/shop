flags:
  legacy_banner:
    description: Show the legacy promo banner.
    default: false
  new_checkout:
    description: Route /checkout/v2 to the rewritten checkout (tax, shipping, payments).
    default: false
    owner: payments
  inventory:
    description: Reserve stock per warehouse for orders and expose /inventory/warehouses.
    default: false
    owner: fulfilment
  loyalty:
    description: Earn loyalty points on orders and expose /loyalty/tiers.
    default: false
    owner: growth
  coupons:
    description: Earn coupons points on orders and expose /coupons/list.
    default: false
    owner: marketing
  wishlist:
    description: Let customers save items for later.
    default: false
    owner: growth
  giftnote:
    description: Let customers add a gift note to an order.
    default: false
    owner: growth
  reviews:
    description: Earn reviews points on orders and expose /reviews/list.
    default: false
    owner: growth
  refunds:
    description: Earn refunds points on orders and expose /refunds/list.
    default: false
    owner: growth
