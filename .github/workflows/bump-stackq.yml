# Keeps stackq current. Every 15 minutes (or on demand) this checks stackq's
# latest release and, when .stackq-version is behind, opens a PR that bumps it
# and starts CI on it. The PR body carries the release notes.
#
# Why a version file and not a bot editing `uses:` lines: the built-in
# GITHUB_TOKEN cannot push changes to workflow files, and no PAT is used here.
# The workflows read .stackq-version, so a plain file is all that changes.
name: bump stackq

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: bump-stackq
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.STACKQ_TOKEN || github.token }}
      UPSTREAM: shresthaujjwal/stackq
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE }}
          token: ${{ env.GH_TOKEN }}

      - name: Open a PR when stackq has a newer release
        run: |
          set -euo pipefail
          latest=$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)
          [[ "$latest" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "unexpected tag '$latest'"; exit 1; }
          current=$(tr -d '[:space:]' < .stackq-version 2>/dev/null || echo none)
          if [ "$latest" = "$current" ]; then
            echo "stackq $current is current"
            exit 0
          fi

          branch="bump-stackq-$latest"
          # Proposed before (open, merged, or closed on purpose): leave it alone.
          if [ "$(gh pr list --head "$branch" --state all --json number --jq length)" != 0 ]; then
            echo "$latest was already proposed"
            exit 0
          fi

          # Older bump PRs that were never merged are superseded.
          gh pr list --state open --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("bump-stackq-")) | .number' |
          while read -r n; do
            gh pr close "$n" --delete-branch --comment "Superseded by stackq $latest."
          done

          git config user.name "stackq-bump[bot]"
          git config user.email "stackq-bump@users.noreply.github.com"
          git switch -c "$branch"
          echo "$latest" > .stackq-version
          git add .stackq-version
          git commit -q -m "Bump stackq to $latest"
          git push -u origin "$branch"

          {
            echo "Bumps stackq from \`$current\` to \`$latest\`: https://github.com/$UPSTREAM/releases/tag/$latest"
            echo
            echo "Merging this pins the shop's workflows to that release's binary."
            echo
            echo "## Release notes"
            echo
            gh release view "$latest" -R "$UPSTREAM" --json body --jq .body
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base "$BASE" --head "$branch" --title "Bump stackq to $latest" --body-file "$RUNNER_TEMP/body.md"

          # Pushes and PRs made with the built-in token do not start CI.
          gh workflow run ci.yml --ref "$branch" || true
