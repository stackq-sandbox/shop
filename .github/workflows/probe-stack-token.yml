name: probe stack token
on:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    if: github.head_ref == 'probe-stack-token'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - run: |
          echo "--- create stack [109,110] with GITHUB_TOKEN"
          echo '{"pull_requests":[109,110]}' | gh api -X POST -H "X-GitHub-Api-Version: 2026-03-10" "repos/$REPO/stacks" --input - 2>&1 | head -c 700; echo
          echo "--- PR 110 stack"
          gh api -H "X-GitHub-Api-Version: 2026-03-10" "repos/$REPO/pulls/110" --jq '.stack' 2>&1 | head -c 300; echo
