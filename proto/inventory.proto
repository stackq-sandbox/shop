syntax = "proto3";

package shop.inventory.v1;

message Item {
  string sku = 1;
  string name = 2;
  int32 weight_g = 3;
  int32 reorder = 4;
}

message Warehouse {
  string id = 1;
  string name = 2;
  string region = 3;
  int32 capacity = 4;
}

message Level {
  string warehouse = 1;
  string sku = 2;
  int32 on_hand = 3;
  int32 reserved = 4;
}

message ReserveRequest {
  string order_id = 1;
  string warehouse = 2;
}

message ReserveLine {
  string sku = 1;
  int32 qty = 2;
}

message Reservation {
  string id = 1;
  string warehouse = 2;
}

message ReceiveRequest {
  string warehouse = 1;
  string sku = 2;
  int32 qty = 3;
}

message ReorderRequest {
  string warehouse = 1;
}

message ReorderResponse {
  string sku = 1;
}

service Inventory {
  rpc ListWarehouses(ReorderRequest) returns (stream Warehouse);
  rpc Receive(ReceiveRequest) returns (Level);
  rpc Reserve(ReserveRequest) returns (Reservation);
  rpc Release(Reservation) returns (Reservation);
  rpc Commit(Reservation) returns (Reservation);
  rpc NeedsReorder(ReorderRequest) returns (ReorderResponse);
}
